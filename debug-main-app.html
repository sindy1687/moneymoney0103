<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>主應用程式調試</title>
    <link rel="stylesheet" href="styles.css">
    <script type="application/x-player-script" data-src="js/theme.js"></script>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        .debug-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .controls {
            margin: 20px 0;
            text-align: center;
        }
        .controls button {
            margin: 5px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #007bff;
            color: white;
            font-size: 14px;
        }
        .controls button:hover {
            background: #0056b3;
        }
        .controls button.active {
            background: #28a745;
        }
        .overview-summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .summary-card {
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .summary-icon {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .summary-label {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        .summary-value {
            font-size: 18px;
            font-weight: bold;
        }
        .debug-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-family: monospace;
            font-size: 12px;
            border: 1px solid #dee2e6;
        }
    </style>
</head>
<body>
    <div class="debug-container">
        <h1>🔍 主應用程式調試</h1>
        
        <div class="controls">
            <button onclick="testTheme('blue')">藍色主題</button>
            <button onclick="testTheme('pink')">粉色主題</button>
            <button onclick="testTheme('festive')">節日慶典主題</button>
            <button onclick="forceFestive()">強制節日慶典</button>
            <button onclick="checkAll()">檢查所有狀態</button>
        </div>

        <!-- 使用主應用程式的真實結構 -->
        <div class="overview-summary-grid" id="overviewSummaryGrid">
            <div class="summary-card primary">
                <div class="summary-icon">💰</div>
                <div class="summary-content">
                    <div class="summary-label">總投入金額</div>
                    <div class="summary-value auto-size" id="totalInvested">NT$125,000</div>
                </div>
            </div>
            <div class="summary-card highlight">
                <div class="summary-icon">📊</div>
                <div class="summary-content">
                    <div class="summary-label">總市值</div>
                    <div class="summary-value" id="totalMarketValue">NT$145,000</div>
                </div>
            </div>
            <div class="summary-card highlight">
                <div class="summary-icon">📈</div>
                <div class="summary-content">
                    <div class="summary-label">未實現損益</div>
                    <div class="summary-value">NT$20,000</div>
                </div>
            </div>
            <div class="summary-card primary">
                <div class="summary-icon">💵</div>
                <div class="summary-content">
                    <div class="summary-label">股息收入</div>
                    <div class="summary-value">NT$2,500</div>
                </div>
            </div>
        </div>
        
        <div class="debug-info">
            <div>當前主題: <span id="currentTheme">檢查中...</span></div>
            <div>HTML屬性: <span id="htmlAttribute">檢查中...</span></div>
            <div>localStorage: <span id="localStorage">檢查中...</span></div>
            <div>背景圖片: <span id="bgImage">檢查中...</span></div>
            <div>背景顏色: <span id="bgColor">檢查中...</span></div>
            <div>邊框顏色: <span id="borderColor">檢查中...</span></div>
            <div>檢測結果: <span id="testResult">檢查中...</span></div>
        </div>
    </div>

    <script type="application/x-player-script">
        function testTheme(themeId) {
            console.log('測試主題:', themeId);
            
            // 使用主應用程式的JavaScript函數
            if (typeof applyTheme === 'function') {
                applyTheme(themeId);
            } else {
                // 備用方法
                document.documentElement.setAttribute('data-theme', themeId);
            }
            
            updateDebugInfo();
        }
        
        function forceFestive() {
            console.log('強制設置節日慶典主題');
            
            // 直接設置
            document.documentElement.setAttribute('data-theme', 'festive');
            playerStorage.setItem('selectedTheme', 'festive');
            playerStorage.setItem('theme', 'festive');
            
            // 強制重新計算樣式
            const cards = document.querySelectorAll('.summary-card');
            cards.forEach(card => {
                card.style.display = 'none';
                setTimeout(() => {
                    card.style.display = '';
                }, 10);
            });
            
            updateDebugInfo();
        }
        
        function checkAll() {
            console.log('=== 檢查所有狀態 ===');
            
            const root = document.documentElement;
            console.log('根元素:', root);
            console.log('根元素屬性:', root.attributes);
            console.log('data-theme:', root.getAttribute('data-theme'));
            
            // 檢查playerStorage
            console.log('playerStorage selectedTheme:', playerStorage.getItem('selectedTheme'));
            console.log('playerStorage theme:', playerStorage.getItem('theme'));
            
            // 檢查主題函數
            console.log('applyTheme函數存在:', typeof applyTheme);
            console.log('getCurrentTheme函數存在:', typeof getCurrentTheme);
            
            // 檢查CSS規則
            const styleSheets = document.styleSheets;
            console.log('樣式表數量:', styleSheets.length);
            
            let festiveRules = 0;
            for (let i = 0; i < styleSheets.length; i++) {
                try {
                    const sheet = styleSheets[i];
                    const rules = sheet.cssRules || sheet.rules;
                    
                    for (let j = 0; j < rules.length; j++) {
                        const rule = rules[j];
                        if (rule.selectorText && rule.selectorText.includes('festive')) {
                            console.log(`找到節日慶典規則: ${rule.selectorText}`);
                            festiveRules++;
                        }
                    }
                } catch (e) {
                    console.warn(`無法讀取樣式表 ${i}:`, e);
                }
            }
            
            console.log('節日慶典CSS規則數量:', festiveRules);
            
            updateDebugInfo();
        }
        
        function updateDebugInfo() {
            const root = document.documentElement;
            const currentTheme = root.getAttribute('data-theme');
            const firstCard = document.querySelector('.summary-card');
            
            document.getElementById('currentTheme').textContent = currentTheme || '(無)';
            document.getElementById('htmlAttribute').textContent = root.outerHTML.substring(0, 100) + '...';
            document.getElementById('playerStorage').textContent = 
                `selectedTheme: ${playerStorage.getItem('selectedTheme')}, theme: ${playerStorage.getItem('theme')}`;
            
            if (firstCard) {
                const style = getComputedStyle(firstCard);
                const bgImage = style.backgroundImage;
                const bgColor = style.backgroundColor;
                const borderColor = style.borderColor;
                
                document.getElementById('bgImage').textContent = bgImage.substring(0, 80) + '...';
                document.getElementById('bgColor').textContent = bgColor;
                document.getElementById('borderColor').textContent = borderColor;
                
                // 檢測結果
                const hasBackgroundImage = bgImage && bgImage !== 'none' && bgImage.includes('pinimg');
                const hasFestiveColor = bgColor.includes('230, 57, 70');
                const hasFestiveBorder = borderColor.includes('252, 163, 17');
                
                if (currentTheme === 'festive' && hasBackgroundImage && hasFestiveColor) {
                    document.getElementById('testResult').innerHTML = '<span style="color: green;">✅ 主應用程式成功！</span>';
                } else {
                    let result = '<span style="color: red;">❌ 主應用程式有問題</span><br>';
                    result += `主題正確: ${currentTheme === 'festive' ? '✅' : '❌'}<br>`;
                    result += `背景圖片: ${hasBackgroundImage ? '✅' : '❌'}<br>`;
                    result += `節日顏色: ${hasFestiveColor ? '✅' : '❌'}<br>`;
                    result += `節日邊框: ${hasFestiveBorder ? '✅' : '❌'}`;
                    document.getElementById('testResult').innerHTML = result;
                }
            }
        }
        
        // 初始化
        document.addEventListener('playerappready', function() {
            setTimeout(() => {
                updateDebugInfo();
                checkAll();
            }, 200);
        });
    </script>
<script src="js/player-storage.js"></script>
<script src="js/app-bootstrap.js" data-storage-name="money-diagnostic-debug-main-app.html"></script>
</body>
</html>

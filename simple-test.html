<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡單測試 - 節日慶典主題</title>
    <style>
        /* 基本樣式 */
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        
        /* 節日慶典主題變數 */
        :root[data-theme="festive"] {
            --color-primary: #E63946;
            --bg-card: rgba(255, 255, 255, 0.9);
            --border-primary: #E63946;
        }
        
        /* 預算頁面基本樣式 */
        .page-budget {
            min-height: calc(100vh - 60px);
            padding: 20px;
            background: var(--bg-primary);
            border-radius: 8px;
        }
        
        /* 節日慶典主題 - 預算設定頁面背景圖片 */
        :root[data-theme="festive"] .page-budget {
            background: url("https://i.pinimg.com/736x/6f/49/9a/6f499af434927a2eff91221a60393ae5.jpg") center/cover !important;
            background-blend-mode: overlay !important;
            background-color: rgba(230, 57, 70, 0.2) !important;
            position: relative !important;
            border: 3px solid var(--color-primary) !important;
            border-radius: 20px !important;
        }
        
        :root[data-theme="festive"] .page-budget::before {
            content: '' !important;
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            right: 0 !important;
            bottom: 0 !important;
            background: linear-gradient(135deg, rgba(230, 57, 70, 0.3) 0%, rgba(252, 163, 17, 0.2) 50%, rgba(6, 255, 165, 0.2) 100%) !important;
            z-index: 0 !important;
            border-radius: 17px !important;
        }
        
        :root[data-theme="festive"] .page-budget > * {
            position: relative !important;
            z-index: 1 !important;
        }
        
        /* 預算摘要樣式 */
        .budget-summary {
            background: var(--bg-card);
            border: 2px solid var(--border-primary);
            border-radius: 20px;
            padding: 20px;
            margin: 20px 0;
            backdrop-filter: blur(15px);
        }
        
        :root[data-theme="festive"] .budget-summary {
            background: rgba(255, 255, 255, 0.9) !important;
            border: 2px solid var(--color-primary) !important;
            backdrop-filter: blur(15px) !important;
        }
        
        .budget-summary-item {
            background: rgba(230, 57, 70, 0.1);
            border: 1px solid rgba(230, 57, 70, 0.2);
            border-radius: 12px;
            padding: 10px;
            margin: 10px 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        /* 主題切換按鈕 */
        .theme-switcher {
            margin-bottom: 20px;
        }
        
        .theme-switcher button {
            margin: 5px;
            padding: 10px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background: #007bff;
            color: white;
        }
        
        .theme-switcher button:hover {
            background: #0056b3;
        }
        
        .theme-switcher button.active {
            background: #28a745;
        }
        
        /* 調試信息 */
        .debug-info {
            background: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            font-family: monospace;
            font-size: 12px;
        }
    </style>
</head>
<body>
    <h1>🎊 節日慶典主題 - 簡單測試</h1>
    
    <div class="theme-switcher">
        <button onclick="switchTheme('pink')">粉色主題</button>
        <button onclick="switchTheme('blue')">藍色主題</button>
        <button onclick="switchTheme('festive')" class="active">節日慶典主題</button>
    </div>

    <div class="page-budget" id="pageBudget">
        <h2 style="color: white; text-shadow: 2px 2px 4px rgba(0,0,0,0.8);">預算設定</h2>
        
        <div class="budget-summary">
            <div class="budget-summary-item">
                <span>總預算</span>
                <span>NT$50,000</span>
            </div>
            <div class="budget-summary-item">
                <span>已使用</span>
                <span>NT$15,000</span>
            </div>
            <div class="budget-summary-item">
                <span>剩餘</span>
                <span>NT$35,000</span>
            </div>
        </div>
        
        <div style="background: rgba(255,255,255,0.9); padding: 15px; border-radius: 12px; margin: 10px 0;">
            <h3 style="color: #E63946;">🍔 餐飲</h3>
            <p>預算: NT$5,000 | 已使用: NT$3,000</p>
        </div>
        
        <div style="background: rgba(255,255,255,0.9); padding: 15px; border-radius: 12px; margin: 10px 0;">
            <h3 style="color: #E63946;">🚗 交通</h3>
            <p>預算: NT$3,000 | 已使用: NT$1,200</p>
        </div>
    </div>

    <div class="debug-info" id="debugInfo">
        <div>當前主題: <span id="currentTheme">festive</span></div>
        <div>背景圖片: <span id="bgImage">檢查中...</span></div>
        <div>背景顏色: <span id="bgColor">檢查中...</span></div>
        <div>邊框顏色: <span id="borderColor">檢查中...</span></div>
    </div>

    <script type="application/x-player-script">
        function switchTheme(themeId) {
            const root = document.documentElement;
            root.setAttribute('data-theme', themeId);
            
            // 更新按鈕狀態
            document.querySelectorAll('.theme-switcher button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // 更新調試信息
            updateDebugInfo();
        }
        
        function updateDebugInfo() {
            const pageBudget = document.querySelector('.page-budget');
            const computedStyle = getComputedStyle(pageBudget);
            
            document.getElementById('currentTheme').textContent = 
                document.documentElement.getAttribute('data-theme');
            document.getElementById('bgImage').textContent = 
                computedStyle.backgroundImage.substring(0, 100) + '...';
            document.getElementById('bgColor').textContent = 
                computedStyle.backgroundColor;
            document.getElementById('borderColor').textContent = 
                computedStyle.borderColor;
            
            console.log('=== 調試信息 ===');
            console.log('當前主題:', document.documentElement.getAttribute('data-theme'));
            console.log('背景圖片:', computedStyle.backgroundImage);
            console.log('背景顏色:', computedStyle.backgroundColor);
            console.log('邊框顏色:', computedStyle.borderColor);
        }
        
        // 初始化
        document.addEventListener('playerappready', function() {
            setTimeout(updateDebugInfo, 100);
        });
    </script>
<script src="js/player-storage.js"></script>
<script src="js/app-bootstrap.js" data-storage-name="money-diagnostic-simple-test.html"></script>
</body>
</html>

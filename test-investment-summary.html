<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>投資摘要卡片測試</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .theme-switcher {
            margin-bottom: 20px;
            text-align: center;
        }
        .theme-switcher button {
            margin: 5px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #007bff;
            color: white;
            font-size: 14px;
        }
        .theme-switcher button:hover {
            background: #0056b3;
        }
        .theme-switcher button.active {
            background: #28a745;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: white;
        }
        .test-section h3 {
            margin-top: 0;
            color: #333;
        }
        .overview-summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin: 20px 0;
        }
        .summary-card {
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            transition: all 0.3s ease;
        }
        .summary-card.primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .summary-card.highlight {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
        }
        .summary-icon {
            font-size: 24px;
            margin-bottom: 10px;
        }
        .summary-label {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 5px;
        }
        .summary-value {
            font-size: 18px;
            font-weight: bold;
        }
        .debug-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-family: monospace;
            font-size: 12px;
            border: 1px solid #dee2e6;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🔍 投資摘要卡片背景圖片測試</h1>
        
        <div class="theme-switcher">
            <button onclick="switchTheme('blue')">藍色主題</button>
            <button onclick="switchTheme('pink')">粉色主題</button>
            <button onclick="switchTheme('festive')" class="active">節日慶典主題</button>
        </div>

        <div class="test-section">
            <h3>投資摘要卡片測試</h3>
            <div class="overview-summary-grid">
                <div class="summary-card primary">
                    <div class="summary-icon">💰</div>
                    <div class="summary-content">
                        <div class="summary-label">總投入金額</div>
                        <div class="summary-value">NT$125,000</div>
                    </div>
                </div>
                <div class="summary-card highlight">
                    <div class="summary-icon">📊</div>
                    <div class="summary-content">
                        <div class="summary-label">總市值</div>
                        <div class="summary-value">NT$145,000</div>
                    </div>
                </div>
                <div class="summary-card highlight">
                    <div class="summary-icon">📈</div>
                    <div class="summary-content">
                        <div class="summary-label">未實現損益</div>
                        <div class="summary-value">NT$20,000</div>
                    </div>
                </div>
                <div class="summary-card primary">
                    <div class="summary-icon">💵</div>
                    <div class="summary-content">
                        <div class="summary-label">股息收入</div>
                        <div class="summary-value">NT$2,500</div>
                    </div>
                </div>
            </div>
            
            <div class="debug-info">
                <div>當前主題: <span id="currentTheme">festive</span></div>
                <div>背景圖片: <span id="bgImage">檢查中...</span></div>
                <div>背景顏色: <span id="bgColor">檢查中...</span></div>
                <div>邊框顏色: <span id="borderColor">檢查中...</span></div>
                <div>CSS規則: <span id="cssRules">檢查中...</span></div>
            </div>
        </div>

        <div class="test-section">
            <h3>圖片載入測試</h3>
            <div class="debug-info" id="imageTest">
                <div>測試圖片載入中...</div>
            </div>
        </div>
    </div>

    <script type="application/x-player-script">
        function switchTheme(themeId) {
            const root = document.documentElement;
            root.setAttribute('data-theme', themeId);
            
            // 更新按鈕狀態
            document.querySelectorAll('.theme-switcher button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // 更新調試信息
            updateDebugInfo();
        }
        
        function updateDebugInfo() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            document.getElementById('currentTheme').textContent = currentTheme;
            
            // 檢查摘要卡片
            const summaryCard = document.querySelector('.summary-card');
            if (summaryCard) {
                const style = getComputedStyle(summaryCard);
                document.getElementById('bgImage').textContent = 
                    style.backgroundImage.substring(0, 100) + '...';
                document.getElementById('bgColor').textContent = 
                    style.backgroundColor;
                document.getElementById('borderColor').textContent = 
                    style.borderColor;
            }
            
            // 檢查CSS規則
            checkCSSRules();
            
            // 測試圖片載入
            testImageLoad();
        }
        
        function checkCSSRules() {
            const cssRulesDiv = document.getElementById('cssRules');
            let rules = [];
            
            // 獲取所有CSS規則
            const styleSheets = document.styleSheets;
            for (let i = 0; i < styleSheets.length; i++) {
                try {
                    const sheet = styleSheets[i];
                    const sheetRules = sheet.cssRules || sheet.rules;
                    for (let j = 0; j < sheetRules.length; j++) {
                        const rule = sheetRules[j];
                        if (rule.selectorText && 
                            (rule.selectorText.includes('festive') && 
                             rule.selectorText.includes('summary-card'))) {
                            rules.push({
                                selector: rule.selectorText,
                                style: rule.style.cssText
                            });
                        }
                    }
                } catch (e) {
                    console.warn('無法讀取樣式表', i, e);
                }
            }
            
            document.getElementById('cssRules').textContent = rules.length + ' 個規則';
        }
        
        function testImageLoad() {
            const imageUrl = 'https://i.pinimg.com/1200x/ba/24/9a/ba249a3cc3f9f317683f78c240ff0686.jpg';
            const imageDiv = document.getElementById('imageTest');
            
            let html = `<div>測試圖片: ${imageUrl}</div>`;
            
            const img = new Image();
            img.onload = function() {
                html += `<div style="color: green;">✅ 圖片載入成功</div>`;
                html += `<div>尺寸: ${this.naturalWidth} x ${this.naturalHeight}</div>`;
                imageDiv.innerHTML = html;
            };
            
            img.onerror = function() {
                html += `<div style="color: red;">❌ 圖片載入失敗</div>`;
                html += `<div>可能原因: CORS限制或圖片不存在</div>`;
                imageDiv.innerHTML = html;
            };
            
            img.src = imageUrl;
        }
        
        // 初始化
        document.addEventListener('playerappready', function() {
            setTimeout(updateDebugInfo, 100);
        });
    </script>
<script src="js/player-storage.js"></script>
<script src="js/app-bootstrap.js" data-storage-name="money-diagnostic-test-investment-summary.html"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>預算卡片修復測試</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }
        .test-container {
            max-width: 800px;
            margin: 0 auto;
        }
        .theme-switcher {
            margin-bottom: 20px;
            text-align: center;
        }
        .theme-switcher button {
            margin: 5px;
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #007bff;
            color: white;
            font-size: 14px;
        }
        .theme-switcher button:hover {
            background: #0056b3;
        }
        .theme-switcher button.active {
            background: #28a745;
        }
        .test-section {
            margin: 20px 0;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 12px;
            background: white;
        }
        .test-section h3 {
            margin-top: 0;
            color: #333;
        }
        .debug-info {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            font-family: monospace;
            font-size: 12px;
            border: 1px solid #dee2e6;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h1>🔧 預算卡片背景圖片修復測試</h1>
        
        <div class="theme-switcher">
            <button onclick="switchTheme('blue')">藍色主題</button>
            <button onclick="switchTheme('pink')">粉色主題</button>
            <button onclick="switchTheme('festive')" class="active">節日慶典主題</button>
        </div>

        <div class="test-section">
            <h3>1. 預算摘要卡片測試</h3>
            <div class="budget-summary">
                <div class="budget-summary-item">
                    <span class="budget-summary-label">總預算</span>
                    <span class="budget-summary-value budget-total">NT$50,000</span>
                </div>
                <div class="budget-summary-item">
                    <span class="budget-summary-label">已使用</span>
                    <span class="budget-summary-value budget-used">NT$15,000</span>
                </div>
                <div class="budget-summary-item">
                    <span class="budget-summary-label">剩餘</span>
                    <span class="budget-summary-value budget-remaining">NT$35,000</span>
                </div>
            </div>
            
            <div class="debug-info">
                <div>當前主題: <span id="currentTheme">festive</span></div>
                <div>背景圖片: <span id="bgImage">檢查中...</span></div>
                <div>背景顏色: <span id="bgColor">檢查中...</span></div>
                <div>邊框顏色: <span id="borderColor">檢查中...</span></div>
            </div>
        </div>

        <div class="test-section">
            <h3>2. 預算項目卡片測試</h3>
            <div class="budget-list">
                <div class="budget-item">
                    <div class="budget-category">🍔 餐飲</div>
                    <div class="budget-amount">NT$5,000</div>
                    <div class="budget-progress">
                        <div class="progress-bar" style="width: 60%"></div>
                    </div>
                </div>
                <div class="budget-item">
                    <div class="budget-category">🚗 交通</div>
                    <div class="budget-amount">NT$3,000</div>
                    <div class="budget-progress">
                        <div class="progress-bar" style="width: 40%"></div>
                    </div>
                </div>
                <div class="budget-item">
                    <div class="budget-category">🛍️ 購物</div>
                    <div class="budget-amount">NT$7,000</div>
                    <div class="budget-progress">
                        <div class="progress-bar" style="width: 80%"></div>
                    </div>
                </div>
            </div>
            
            <div class="debug-info">
                <div>背景圖片: <span id="itemBgImage">檢查中...</span></div>
                <div>背景顏色: <span id="itemBgColor">檢查中...</span></div>
                <div>邊框顏色: <span id="itemBorderColor">檢查中...</span></div>
            </div>
        </div>

        <div class="test-section">
            <h3>3. 圖片載入測試</h3>
            <div class="debug-info" id="imageTest">
                <div>測試圖片載入中...</div>
            </div>
        </div>
    </div>

    <script type="application/x-player-script">
        function switchTheme(themeId) {
            const root = document.documentElement;
            root.setAttribute('data-theme', themeId);
            
            // 更新按鈕狀態
            document.querySelectorAll('.theme-switcher button').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // 更新調試信息
            updateDebugInfo();
        }
        
        function updateDebugInfo() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            document.getElementById('currentTheme').textContent = currentTheme;
            
            // 檢查預算摘要卡片
            const budgetSummary = document.querySelector('.budget-summary');
            if (budgetSummary) {
                const style = getComputedStyle(budgetSummary);
                document.getElementById('bgImage').textContent = 
                    style.backgroundImage.substring(0, 100) + '...';
                document.getElementById('bgColor').textContent = 
                    style.backgroundColor;
                document.getElementById('borderColor').textContent = 
                    style.borderColor;
            }
            
            // 檢查預算項目卡片
            const budgetItem = document.querySelector('.budget-item');
            if (budgetItem) {
                const style = getComputedStyle(budgetItem);
                document.getElementById('itemBgImage').textContent = 
                    style.backgroundImage.substring(0, 100) + '...';
                document.getElementById('itemBgColor').textContent = 
                    style.backgroundColor;
                document.getElementById('itemBorderColor').textContent = 
                    style.borderColor;
            }
            
            // 測試圖片載入
            testImageLoad();
        }
        
        function testImageLoad() {
            const imageUrl = 'https://i.pinimg.com/736x/6f/49/9a/6f499af434927a2eff91221a60393ae5.jpg';
            const imageDiv = document.getElementById('imageTest');
            
            let html = `<div>測試圖片: ${imageUrl}</div>`;
            
            const img = new Image();
            img.onload = function() {
                html += `<div style="color: green;">✅ 圖片載入成功</div>`;
                html += `<div>尺寸: ${this.naturalWidth} x ${this.naturalHeight}</div>`;
                imageDiv.innerHTML = html;
            };
            
            img.onerror = function() {
                html += `<div style="color: red;">❌ 圖片載入失敗</div>`;
                html += `<div>可能原因: CORS限制或圖片不存在</div>`;
                imageDiv.innerHTML = html;
            };
            
            img.src = imageUrl;
        }
        
        // 初始化
        document.addEventListener('playerappready', function() {
            setTimeout(updateDebugInfo, 100);
        });
    </script>
<script src="js/player-storage.js"></script>
<script src="js/app-bootstrap.js" data-storage-name="money-diagnostic-test-budget-fix.html"></script>
</body>
</html>
